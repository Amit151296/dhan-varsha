version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: dhanvarsha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dhanvarsha
      POSTGRES_PASSWORD: dhanvarsha123
      POSTGRES_DB: dhanvarsha
    ports:
      - "5432:5432"
    volumes:
      - dhanvarsha_pgdata:/var/lib/postgresql/data

volumes:
  dhanvarsha_pgdata:
